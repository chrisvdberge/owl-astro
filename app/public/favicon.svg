<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Owl Astro">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <path id="star" d="M0-15C1.5-5 5-1.5 15 0C5 1.500 1.500 5 0 15C-1.500 5-5 1.500-15 0C-5-1.500-1.500-5 0-15Z"/>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- head with ear tufts -->
  <path d="M24 36L42 46Q64 38 86 46L104 36V70Q104 106 64 110Q24 106 24 70Z"
        fill="#162033" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="45" cy="68" r="19" fill="#e5e7eb"/>
  <circle cx="83" cy="68" r="19" fill="#e5e7eb"/>
  <circle cx="45" cy="68" r="19" fill="none" stroke="#38bdf8" stroke-width="3" opacity=".6"/>
  <circle cx="83" cy="68" r="19" fill="none" stroke="#38bdf8" stroke-width="3" opacity=".6"/>
  <use href="#star" x="45" y="68" fill="#0b0f17"/>
  <use href="#star" x="83" y="68" fill="#0b0f17"/>
  <circle cx="45" cy="68" r="2.500" fill="#38bdf8"/>
  <circle cx="83" cy="68" r="2.500" fill="#38bdf8"/>
  <!-- beak -->
  <path d="M59 84L69 84L64 95Z" fill="#fbbf24"/>
  <!-- stars -->
  <circle cx="108" cy="20" r="2.500" fill="#e5e7eb" opacity=".7"/>
  <circle cx="20" cy="22" r="2" fill="#e5e7eb" opacity=".5"/>
</svg>
