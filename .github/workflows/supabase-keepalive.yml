# Free-tier Supabase projects pause after ~7 days without activity.
# A small read every two days counts as activity and keeps the project awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/guide_comments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
